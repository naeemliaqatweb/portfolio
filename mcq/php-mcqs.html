  <script>
    const questions = [
    { question: "What does PHP stand for?", options: ["Hypertext Preprocessor", "Preprocessed Hypertext Page", "Personal Home Page", "Private Home Page"], answer: 0 },
      { question: "Which symbol is used to declare a variable in PHP?", options: ["$", "#", "@", "&"], answer: 0 },
      { question: "Which of the following is the correct way to end a PHP statement?", options: [";", ".", ":", "!"], answer: 0 },
      { question: "Which function is used to output text in PHP?", options: ["echo", "print", "write", "Both echo and print"], answer: 3 },
      { question: "How do you write a single-line comment in PHP?", options: ["// comment", "# comment", "/* comment */", "Both // and #"], answer: 3 },
      { question: "Which superglobal is used to collect form data sent with POST?", options: ["$_POST", "$_GET", "$_REQUEST", "$_FORM"], answer: 0 },
      { question: "How do you create a function in PHP?", options: ["function myFunc()", "create myFunc()", "define myFunc()", "method myFunc()"], answer: 0 },
      { question: "Which operator is used for concatenation in PHP?", options: [".", "+", "&", ","], answer: 0 },
      { question: "Which function is used to count elements in an array?", options: ["count()", "size()", "length()", "total()"], answer: 0 },
      { question: "Which function is used to include another file in PHP?", options: ["include", "require", "Both include and require", "import"], answer: 2 },
      { question: "What is the default file extension of PHP files?", options: [".php", ".html", ".xml", ".js"], answer: 0 },
      { question: "Which tag is used to start PHP code?", options: ["<?php", "<?", "<script>", "<?="], answer: 0 },
      { question: "How do you define a constant in PHP?", options: ["define()", "const", "constant()", "set()"], answer: 0 },
      { question: "Which function is used to get the length of a string?", options: ["strlen()", "count()", "length()", "strcount()"], answer: 0 },
      { question: "What does isset() do?", options: ["Checks if a variable is set and not null", "Declares a variable", "Removes a variable", "Prints a variable"], answer: 0 },
      { question: "Which function is used to redirect a user to a new page?", options: ["header()", "redirect()", "location()", "goto()"], answer: 0 },
      { question: "What is the result of 10 % 3 in PHP?", options: ["1", "3", "0.3", "3.33"], answer: 0 },
      { question: "What is the scope of a variable declared inside a function?", options: ["Local", "Global", "Static", "Public"], answer: 0 },
      { question: "How can you access a global variable inside a function?", options: ["global $var;", "$GLOBALS['var']", "Both A and B", "None of the above"], answer: 2 },
      { question: "Which function is used to read a file into a string?", options: ["file_get_contents()", "read_file()", "fopen()", "file()"], answer: 0 },
      { question: "How do you define a class in PHP?", options: ["class ClassName {}", "function ClassName {}", "define ClassName {}", "new ClassName()"], answer: 0 },
      { question: "What is the correct way to start a session in PHP?", options: ["session_start();", "start_session();", "begin_session();", "open_session();"], answer: 0 },
      { question: "Which function destroys a session?", options: ["session_destroy();", "destroy_session();", "end_session();", "unset_session();"], answer: 0 },
      { question: "How do you check if a file exists in PHP?", options: ["file_exists()", "exists()", "file_check()", "check_file()"], answer: 0 },
      { question: "Which method is used to send a cookie to the browser?", options: ["setcookie()", "sendcookie()", "cookie()", "createcookie()"], answer: 0 },
      { question: "Which of these is a valid loop in PHP?", options: ["for", "while", "foreach", "All of the above"], answer: 3 },
      { question: "Which magic method is called when an object is created?", options: ["__construct()", "__create()", "__make()", "__build()"], answer: 0 },
      { question: "Which keyword is used to inherit a class in PHP?", options: ["extends", "implements", "inherits", "uses"], answer: 0 },
      { question: "Which function converts special characters to HTML entities?", options: ["htmlspecialchars()", "htmlentities()", "escape()", "Both A and B"], answer: 3 },
      { question: "Which PHP error control operator is used to suppress errors?", options: ["@", "#", "!", "&"], answer: 0 }
    ];

    const quizContainer = document.getElementById("quiz-container");
    const resultContainer = document.getElementById("result");
    let score = 0;

    questions.forEach((q, index) => {
      const box = document.createElement("div");
      box.classList.add("p-3", "mb-4", "bg-light", "border", "rounded", "col-md-6");
      box.innerHTML = `<h5>Q${index + 1}. ${q.question}</h5>`;

      q.options.forEach((opt, i) => {
        const btn = document.createElement("button");
        btn.classList.add("btn", "btn-outline-primary", "d-block", "my-2", "w-100", "text-start");
        btn.textContent = opt;

        btn.addEventListener("click", function () {
          if (box.classList.contains("answered")) return;

          box.classList.add("answered");
          const buttons = box.querySelectorAll("button");

          buttons.forEach((b, idx) => {
            b.classList.add("disabled");
            b.disabled = true;
            if (idx === q.answer) b.classList.replace("btn-outline-primary", "btn-success");
          });

          if (i !== q.answer) {
            btn.classList.replace("btn-outline-primary", "btn-danger");
          } else {
            score++;
          }

          if (document.querySelectorAll(".answered").length === questions.length) {
            resultContainer.innerHTML = `You scored <span class="text-success">${score}</span> out of <span class="text-primary">${questions.length}</span>`;
          }
        });

        box.appendChild(btn);
      });

      quizContainer.appendChild(box);
    });
  </script>
