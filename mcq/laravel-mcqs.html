  <script>
    const questions = [
    { question: "What is Laravel?", options: ["A PHP framework", "A JavaScript library", "A database", "A CMS"], answer: 0 },
      { question: "What architectural pattern does Laravel follow?", options: ["MVC", "MVVM", "MVP", "None"], answer: 0 },
      { question: "Which command is used to create a new Laravel project?", options: ["laravel new project", "php artisan make:project", "composer new laravel", "laravel create project"], answer: 0 },
      { question: "What is the purpose of .env file?", options: ["Environment configuration", "Routing", "View rendering", "Authentication"], answer: 0 },
      { question: "What is the default database used in Laravel?", options: ["MySQL", "SQLite", "PostgreSQL", "None"], answer: 1 },
      { question: "How do you start the Laravel development server?", options: ["php artisan serve", "npm run serve", "laravel start", "php laravel serve"], answer: 0 },
      { question: "Which directory contains route files in Laravel?", options: ["routes/", "app/routes/", "config/routes/", "src/routes/"], answer: 0 },
      { question: "Which command creates a controller?", options: ["php artisan make:controller", "php artisan controller:create", "make controller", "laravel controller new"], answer: 0 },
      { question: "Which ORM is used in Laravel?", options: ["Eloquent", "Doctrine", "Hibernate", "Sequelize"], answer: 0 },
      { question: "How do you define a route in Laravel?", options: ["Route::get('/', function() {})", "<route url='/' />", "GET('/', ...)", "route('/', ...)"], answer: 0 },
      { question: "Where are Laravel middleware defined?", options: ["app/Http/Middleware", "app/Middleware", "config/middleware", "routes/middleware"], answer: 0 },
      { question: "What does CSRF stand for?", options: ["Cross-Site Request Forgery", "Custom Site Routing Framework", "Create Secure Route Filter", "Cross Site Route Function"], answer: 0 },
      { question: "How to protect a route with authentication middleware?", options: ["->middleware('auth')", "->auth()", "->secure()", "->protected()"], answer: 0 },
      { question: "What file contains Laravel application configuration?", options: ["config/app.php", "app/config.php", "env/config.php", "bootstrap/app.php"], answer: 0 },
      { question: "How do you pass data to a Blade view?", options: ["return view('page', ['key' => 'value'])", "return blade('page')", "return page()->view()", "render('page', 'key')"], answer: 0 },
      { question: "What directive is used to include layouts in Blade?", options: ["@extends", "@include", "@layout", "@view"], answer: 0 },
      { question: "Which command creates a model in Laravel?", options: ["php artisan make:model", "make:model", "laravel new:model", "create:model"], answer: 0 },
      { question: "What is the purpose of a migration?", options: ["Modify database schema", "Style views", "Create models", "Configure sessions"], answer: 0 },
      { question: "Where are Laravel views stored?", options: ["resources/views", "app/views", "routes/views", "storage/views"], answer: 0 },
      { question: "What is the default templating engine used by Laravel?", options: ["Blade", "Twig", "Smarty", "Volt"], answer: 0 },
      { question: "What is the Artisan command to run all migrations?", options: ["php artisan migrate", "php artisan db:migrate", "php artisan up", "php artisan migrate:all"], answer: 0 },
      { question: "How can you rollback the last migration?", options: ["php artisan migrate:rollback", "php artisan rollback", "php artisan db:down", "php artisan undo"], answer: 0 },
      { question: "Which helper function retrieves old form input?", options: ["old()", "input()", "previous()", "formdata()"], answer: 0 },
      { question: "How do you define a route with a parameter?", options: ["Route::get('user/{id}', ...)", "Route::get('user:id', ...)", "Route::param('user')", "Route::url('user')"], answer: 0 },
      { question: "Which file handles service provider registration?", options: ["config/app.php", "bootstrap/app.php", "app/Providers.php", "services/register.php"], answer: 0 },
      { question: "What does the 'web' middleware group include?", options: ["Session, CSRF, Cookies", "Auth only", "API responses", "Headers"], answer: 0 },
      { question: "How to retrieve the current URL in Laravel?", options: ["url()->current()", "get_url()", "request()->url()", "URL::get()"], answer: 0 },
      { question: "Which command creates a request validation class?", options: ["php artisan make:request", "php artisan request:make", "laravel make:form", "make:validation"], answer: 0 },
      { question: "What is Laravel Sanctum used for?", options: ["API Authentication", "Testing", "Database Backup", "Routing"], answer: 0 },
      { question: "What does 'tinker' command do?", options: ["Interactive shell", "Database migration", "Routes test", "Environment check"], answer: 0 }
    ];

    const quizContainer = document.getElementById("quiz-container");
    const resultContainer = document.getElementById("result");
    let score = 0;

    questions.forEach((q, index) => {
      const box = document.createElement("div");
      box.classList.add("p-3", "mb-4", "bg-light", "border", "rounded", "col-md-6");
      box.innerHTML = `<h5>Q${index + 1}. ${q.question}</h5>`;

      q.options.forEach((opt, i) => {
        const btn = document.createElement("button");
        btn.classList.add("btn", "btn-outline-primary", "d-block", "my-2", "w-100", "text-start");
        btn.textContent = opt;

        btn.addEventListener("click", function () {
          if (box.classList.contains("answered")) return;

          box.classList.add("answered");
          const buttons = box.querySelectorAll("button");

          buttons.forEach((b, idx) => {
            b.classList.add("disabled");
            b.disabled = true;
            if (idx === q.answer) b.classList.replace("btn-outline-primary", "btn-success");
          });

          if (i !== q.answer) {
            btn.classList.replace("btn-outline-primary", "btn-danger");
          } else {
            score++;
          }

          if (document.querySelectorAll(".answered").length === questions.length) {
            resultContainer.innerHTML = `You scored <span class="text-success">${score}</span> out of <span class="text-primary">${questions.length}</span>`;
          }
        });

        box.appendChild(btn);
      });

      quizContainer.appendChild(box);
    });
  </script>
