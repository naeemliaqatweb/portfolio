  <script>
    const questions = [
    { question: "What does OOP stand for?", options: ["Object Oriented Programming", "Ordered Object Programming", "Original Object Plan", "Object Operational Process"], answer: 0 },
      { question: "Which of the following is not a feature of OOP?", options: ["Encapsulation", "Polymorphism", "Inheritance", "Compilation"], answer: 3 },
      { question: "What is encapsulation?", options: ["Wrapping data and code together", "Overriding functions", "Multiple inheritance", "Deriving classes"], answer: 0 },
      { question: "What is polymorphism?", options: ["Same function name, different implementation", "Hiding data", "Base class creation", "Function chaining"], answer: 0 },
      { question: "Which keyword is used to create a class in C++?", options: ["class", "object", "def", "function"], answer: 0 },
      { question: "What is inheritance?", options: ["Acquiring properties from base class", "Modifying data", "Storing variables", "Converting data types"], answer: 0 },
      { question: "Which concept allows treating objects of different classes in the same way?", options: ["Polymorphism", "Inheritance", "Abstraction", "Encapsulation"], answer: 0 },
      { question: "What does abstraction mean in OOP?", options: ["Hiding internal details", "Showing all details", "Creating loops", "Handling exceptions"], answer: 0 },
      { question: "Which of these supports multiple inheritance?", options: ["C++", "Java", "Python", "C#"], answer: 0 },
      { question: "Which of these languages is fully OOP?", options: ["Java", "C", "Python", "PHP"], answer: 0 },
      { question: "What is a constructor?", options: ["A special function to initialize objects", "A method to destroy objects", "A loop initializer", "A condition checker"], answer: 0 },
      { question: "Destructor is used for?", options: ["Destroying object", "Creating object", "Calling methods", "Cloning object"], answer: 0 },
      { question: "Which of the following is not a type of inheritance?", options: ["Sequential", "Single", "Multiple", "Multilevel"], answer: 0 },
      { question: "How is method overloading achieved?", options: ["Same method name with different parameters", "Same method name in child class", "Multiple classes", "Same data type"], answer: 0 },
      { question: "Which of the following is used to access class members?", options: [". (dot)", "#", "::", "->"], answer: 0 },
      { question: "What is the default access specifier for class members?", options: ["private", "public", "protected", "none"], answer: 0 },
      { question: "What does the 'this' keyword refer to?", options: ["Current object", "Parent class", "Child object", "Constructor"], answer: 0 },
      { question: "Which OOP principle is used in hiding sensitive data?", options: ["Encapsulation", "Inheritance", "Polymorphism", "Overloading"], answer: 0 },
      { question: "Which language was the first to implement OOP?", options: ["Simula", "C++", "Java", "Python"], answer: 0 },
      { question: "Which keyword is used for inheritance in C++?", options: [":", "extends", "inherits", "derive"], answer: 0 },
      { question: "Can abstract class have constructors?", options: ["Yes", "No", "Only in Java", "Only in C++"], answer: 0 },
      { question: "Which principle allows objects to take many forms?", options: ["Polymorphism", "Inheritance", "Encapsulation", "Casting"], answer: 0 },
      { question: "Private members are accessible in?", options: ["Same class", "Derived class", "Outside class", "All of the above"], answer: 0 },
      { question: "Which access specifier allows access from derived class only?", options: ["protected", "public", "private", "static"], answer: 0 },
      { question: "Which feature is not supported by OOP?", options: ["Global variables", "Abstraction", "Polymorphism", "Encapsulation"], answer: 0 },
      { question: "Which function type allows overriding in subclass?", options: ["Virtual", "Static", "Final", "Private"], answer: 0 },
      { question: "Composition is?", options: ["Has-a relationship", "Is-a relationship", "Copy constructor", "Data hiding"], answer: 0 },
      { question: "What is an interface?", options: ["A contract for classes", "A view layer", "A header file", "A database connection"], answer: 0 },
      { question: "In Java, interfaces can contain?", options: ["Only method signatures", "Constructors", "Main method", "Instance variables"], answer: 0 },
      { question: "Which of the following represents class hierarchy?", options: ["UML diagram", "Flowchart", "Class tree", "ERD"], answer: 0 }
    ];

    const quizContainer = document.getElementById("quiz-container");
    const resultContainer = document.getElementById("result");
    let score = 0;

    questions.forEach((q, index) => {
      const box = document.createElement("div");
      box.classList.add("p-3", "mb-4", "bg-light", "border", "rounded", "col-md-6");
      box.innerHTML = `<h5>Q${index + 1}. ${q.question}</h5>`;

      q.options.forEach((opt, i) => {
        const btn = document.createElement("button");
        btn.classList.add("btn", "btn-outline-primary", "d-block", "my-2", "w-100", "text-start");
        btn.textContent = opt;

        btn.addEventListener("click", function () {
          if (box.classList.contains("answered")) return;

          box.classList.add("answered");
          const buttons = box.querySelectorAll("button");

          buttons.forEach((b, idx) => {
            b.classList.add("disabled");
            b.disabled = true;
            if (idx === q.answer) b.classList.replace("btn-outline-primary", "btn-success");
          });

          if (i !== q.answer) {
            btn.classList.replace("btn-outline-primary", "btn-danger");
          } else {
            score++;
          }

          if (document.querySelectorAll(".answered").length === questions.length) {
            resultContainer.innerHTML = `You scored <span class="text-success">${score}</span> out of <span class="text-primary">${questions.length}</span>`;
          }
        });

        box.appendChild(btn);
      });

      quizContainer.appendChild(box);
    });
  </script>
