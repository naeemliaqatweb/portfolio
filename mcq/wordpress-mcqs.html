  <script>
    const questions = [
        { question: "What is WordPress?", options: ["A database", "A CMS", "A programming language", "A browser"], answer: 1 },
      { question: "WordPress is written in which programming language?", options: ["Java", "Python", "PHP", "Ruby"], answer: 2 },
      { question: "Which of the following is a default post type in WordPress?", options: ["Event", "Gallery", "Post", "Project"], answer: 2 },
      { question: "What is the function of a theme in WordPress?", options: ["Manages plugins", "Handles database", "Controls appearance", "Secures site"], answer: 2 },
      { question: "Which file is the entry point for a WordPress theme?", options: ["index.php", "home.php", "style.css", "main.php"], answer: 0 },
      { question: "What is a plugin in WordPress?", options: ["A style sheet", "An image", "A piece of code that adds functionality", "A theme component"], answer: 2 },
      { question: "Which folder contains WordPress themes?", options: ["/plugins/", "/themes/", "/includes/", "/admin/"], answer: 1 },
      { question: "What does the WordPress loop do?", options: ["Processes form input", "Iterates over posts", "Uploads images", "Saves settings"], answer: 1 },
      { question: "Which function is used to include the header.php file?", options: ["include_header()", "get_header()", "load_header()", "require_header()"], answer: 1 },
      { question: "Which function registers a custom post type?", options: ["add_post_type()", "register_type()", "register_post_type()", "new_post_type()"], answer: 2 },
      { question: "What is the default database used by WordPress?", options: ["Oracle", "MongoDB", "MySQL", "PostgreSQL"], answer: 2 },
      { question: "How are plugins installed in WordPress?", options: ["Copy to themes folder", "Paste in core folder", "Upload in plugins folder", "Upload to admin folder"], answer: 2 },
      { question: "What is wp-config.php used for?", options: ["Theme settings", "User login", "Database configuration", "Security policy"], answer: 2 },
      { question: "Which function is used to retrieve post content?", options: ["the_text()", "get_post()", "the_content()", "get_content()"], answer: 2 },
      { question: "Which of the following is a popular WordPress plugin?", options: ["WooCommerce", "Laravel", "Django", "ReactPress"], answer: 0 },
      { question: "What is the role of functions.php file?", options: ["Stores admin data", "Styles the site", "Adds theme functionality", "Manages widgets"], answer: 2 },
      { question: "How do you create a child theme?", options: ["Use Plugin", "Modify style.css only", "Create new folder with style.css and functions.php", "Rename parent theme"], answer: 2 },
      { question: "Which hook runs after WordPress is fully loaded?", options: ["wp_footer", "wp_head", "init", "wp_loaded"], answer: 3 },
      { question: "What is an action hook?", options: ["Handles database", "Triggers at specific points", "Secures login", "Saves CSS"], answer: 1 },
      { question: "Which function adds a menu in WordPress?", options: ["add_menu()", "register_menu()", "add_theme_menu()", "register_nav_menus()"], answer: 3 },
      { question: "Which tag displays the site title?", options: ["<?php get_title(); ?>", "<?php wp_title(); ?>", "<?php bloginfo('name'); ?>", "<?php the_title(); ?>"], answer: 2 },
      { question: "What does wp_enqueue_script() do?", options: ["Renders HTML", "Fetches posts", "Loads JavaScript", "Connects to database"], answer: 2 },
      { question: "Where do widgets appear in WordPress?", options: ["Footer only", "Header only", "Sidebar and footer", "Posts only"], answer: 2 },
      { question: "How can you improve WordPress security?", options: ["Use weak passwords", "Disable updates", "Install security plugins", "Allow file editing"], answer: 2 },
      { question: "Which file handles the 404 error in themes?", options: ["error.php", "notfound.php", "404.php", "missing.php"], answer: 2 },
      { question: "What is the WordPress Codex?", options: ["A plugin", "Official documentation", "A theme", "A CMS"], answer: 1 },
      { question: "Which table stores user data in WordPress?", options: ["wp_users", "wp_admins", "wp_accounts", "wp_members"], answer: 0 },
      { question: "Which function is used to add custom widgets?", options: ["add_widget()", "register_widget()", "create_widget()", "init_widget()"], answer: 1 },
      { question: "What are shortcodes in WordPress?", options: ["CSS snippets", "Database queries", "Placeholders for functions", "JavaScript functions"], answer: 2 },
      { question: "Which file controls the layout of blog posts?", options: ["single.php", "archive.php", "blog.php", "post.php"], answer: 0 }
    ];

    const quizContainer = document.getElementById("quiz-container");
    const resultContainer = document.getElementById("result");
    let score = 0;

    questions.forEach((q, index) => {
      const box = document.createElement("div");
      box.classList.add("p-3", "mb-4", "bg-light", "border", "rounded", "col-md-6");
      box.innerHTML = `<h5>Q${index + 1}. ${q.question}</h5>`;

      q.options.forEach((opt, i) => {
        const btn = document.createElement("button");
        btn.classList.add("btn", "btn-outline-primary", "d-block", "my-2", "w-100", "text-start");
        btn.textContent = opt;

        btn.addEventListener("click", function () {
          if (box.classList.contains("answered")) return;

          box.classList.add("answered");
          const buttons = box.querySelectorAll("button");

          buttons.forEach((b, idx) => {
            b.classList.add("disabled");
            b.disabled = true;
            if (idx === q.answer) b.classList.replace("btn-outline-primary", "btn-success");
          });

          if (i !== q.answer) {
            btn.classList.replace("btn-outline-primary", "btn-danger");
          } else {
            score++;
          }

          if (document.querySelectorAll(".answered").length === questions.length) {
            resultContainer.innerHTML = `You scored <span class="text-success">${score}</span> out of <span class="text-primary">${questions.length}</span>`;
          }
        });

        box.appendChild(btn);
      });

      quizContainer.appendChild(box);
    });
  </script>
